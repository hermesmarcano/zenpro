name: ZEN
options:
  bundleIdPrefix: com.hermesmarcano
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    # Swift 5 language mode a propósito: el SDK/Xcode es reciente (necesario para
    # AlarmKit/Family Controls), pero el modo Swift 6 activa concurrency checking
    # estricto por defecto — migrar a Sendable en todo el codebase es tarea
    # deliberada de M6, no algo para pelear mientras se construye el MVP.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Solo iPhone: el diseño y los flujos (cámara, vibración, alarma de mesilla) son de
    # iPhone, y la validación de App Store exige todas las orientaciones en iPad.
    TARGETED_DEVICE_FAMILY: "1"

targets:
  ZEN:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZEN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmarcano.zen
    info:
      path: ZEN/Info.plist
      properties:
        CFBundleDisplayName: ZEN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Alarma inteligente armada: la app sigue viva con una sesión de audio mientras
        # el usuario duerme, para poder reproducir el tono con volumen dinámico.
        UIBackgroundModes:
          - audio
        NSAlarmKitUsageDescription: "ZEN programa alarmas para despertarte y las apaga solo cuando llegas al punto que elegiste."
        # Sin cifrado propio: evita la pregunta de cumplimiento de exportación en cada build.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "ZEN necesita la cámara para escanear el código o fotografiar el lugar que apaga tu alarma."
        NSLocationAlwaysAndWhenInUseUsageDescription: "ZEN usa tu ubicación para desbloquear apps automáticamente en los lugares que configures, como tu casa o el gimnasio."
        NSLocationWhenInUseUsageDescription: "ZEN usa tu ubicación para desbloquear apps automáticamente en los lugares que configures."
    entitlements:
      path: ZEN/ZEN.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.hermesmarcano.zen
    dependencies:
      - target: ZENDeviceActivityMonitor
        embed: true
      - target: ZENShieldConfiguration
        embed: true
      - target: ZENShieldAction
        embed: true
    scheme:
      testTargets:
        - ZENTests
      gatherCoverageData: true

  ZENDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZENDeviceActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmarcano.zen.DeviceActivityMonitor
    info:
      path: ZENDeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: ZEN Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ZENDeviceActivityMonitor/ZENDeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.hermesmarcano.zen

  ZENShieldConfiguration:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZENShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmarcano.zen.ShieldConfiguration
    info:
      path: ZENShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: ZEN Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ZENShieldConfiguration/ZENShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.hermesmarcano.zen

  ZENShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZENShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmarcano.zen.ShieldAction
    info:
      path: ZENShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ZEN Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ZENShieldAction/ZENShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.hermesmarcano.zen

  ZENTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ZENTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hermesmarcano.zen.Tests
    dependencies:
      - target: ZEN
