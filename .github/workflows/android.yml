name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests de lógica (JVM)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: APK
        run: ./gradlew assembleRelease --console=plain

      - name: Verificar firma y manifiesto
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|targetSdkVersion|sdkVersion|launchable-activity"
          cp "$APK" zen-android.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zen-android-apk
          path: android/zen-android.apk
          if-no-files-found: error

      - name: Informes de test y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore

  # Trabajo aparte y serializado: dos ejecuciones nunca borran/crean la pre-release a la vez, y solo
  # publica desde las ramas de referencia (una rama experimental no pisa el APK que se instala).
  publish:
    permissions:
      contents: write # solo para publicar el APK en la pre-release `android-latest`
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/zen-productivity-alarm-app-gcyndn')
    runs-on: ubuntu-latest
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: zen-android-apk

      # El enlace estable para instalar: https://github.com/<repo>/releases/tag/android-latest
      - name: Publicar APK en la pre-release android-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest zen-android.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ZEN Android (última compilación)" \
            --notes "APK de instalación directa (sideload). Commit $GITHUB_SHA. Instrucciones: docs/ANDROID.md"
